<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecionando...</title>
    <script>
      // Pega a rota atual
      const path = window.location.pathname;

      // Se não estiver na raiz e não for arquivo estático
      if (path !== '/' && !path.includes('.')) {
        // Redireciona para index.html mantendo a rota
        window.location.href = '/Tarefa3/' + path.substring(1);
      }
    </script>
  </head>
  <body>
    <p>Redirecionando...</p>
  </body>
</html>
