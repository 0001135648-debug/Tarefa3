<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecionando...</title>
    <script>
      (function() {
        // Pega o caminho da URL
        const path = window.location.pathname;

        // Nome do repositório (substitua se mudar)
        const repoName = '/Tarefa3/';

        // Se não estiver na raiz e não for arquivo estático
        if (path !== repoName && !path.includes('.')) {
          // Remove a barra inicial
          const relativePath = path.startsWith(repoName)
            ? path.slice(repoName.length)
            : path.slice(1);

          // Redireciona para index.html mantendo a rota
          window.location.href = repoName + '#' + relativePath;
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecionando...</p>
  </body>
</html>
